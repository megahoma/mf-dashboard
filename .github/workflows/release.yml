name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"
      - name: Publish the VSIX on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "mf-dashboard-${version}.vsix" \
            --title "$GITHUB_REF_NAME" \
            --notes "MF Dashboard ${version}"
