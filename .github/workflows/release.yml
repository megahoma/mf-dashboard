name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changelogithub walks commits back to the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"
      - name: Publish the VSIX on the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx changelogithub@15.0.4 \
            --name "$GITHUB_REF_NAME" \
            --to "$GITHUB_REF_NAME" \
            --assets "mf-dashboard-${version}.vsix"
